# 大盘前端的 nginx 配置。这个容器只端 /dash/ 下的静态文件,别的一律 404。
# 数据不经过这里:页面在浏览器里自己经网关取 /reports/*(网关按工号路由到用户自己的 Pod)。
server {
    listen 8080;                      # nginx-unprivileged 非 root,绑不了 80;Service 做 80 → 8080
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    absolute_redirect off;            # 301 用相对 Location,经网关转发时才不会带错主机名

    # 大盘改版要立刻生效:浏览器每次都问一下服务器(no-cache 不是 no-store,304 仍然省流量)
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # /dash 无斜杠 → /dash/,否则页面里的相对解析全错
    location = /dash { return 301 /dash/; }

    # /dash/health 这类路径没有对应文件,回落到 index.html,shell.js 按 pathname 切页
    location /dash/ { try_files $uri $uri/ /dash/index.html; }

    location / { return 404; }
}
