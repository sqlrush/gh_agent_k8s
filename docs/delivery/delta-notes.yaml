# 增量导入包里每条脚本的说明 —— agent/tools/delivery_delta.py 读这份。
#
# **为什么说明要单独维护、而增量清单不要手写。** 2026-10-18 第一次出增量包时,新增 / 变更清单是手写的 ——
# 漏了 4 条正文变更。清单现在由工具对比行方在用的那一版**自动算**;这份文件只负责「为什么」。
# 工具发现某条新增 / 变更在这里没有说明,会直接报错退出 —— 不许静默地出一个缺条目的包。
# (2026-11-05 起在本仓库维护,gh_skill 那份停在 skills-v12.25。)
#
# added: 新增脚本 → [标题, 读取什么, 用途]
# changed: 已有脚本的正文变更 → 一段说明(给中间件团队的变更评审看)

added:
  memanalyze.sql_mem_history:
    - SQL 级内存排行（SQL 执行历史，WLM 资源跟踪不可用时的退路）
    - dbe_perf.statement_history（unique_query_id、user_name、start_time、finish_time、used_memory、query 前 300 字）
    - 内存分析在 WLM 资源跟踪没开、视图没数据时，改从执行历史按单条语句内存用量取近一天的排行；在 postgres 库执行。只读
  wdr.redo_io_live:
    - redo 文件写入的实时累计值（WDR 快照里没有这段时间的数据时的退路）
    - dbe_perf.file_redo_iostat（phywrts、phyblkwrt 求和）
    - WDR 写入来源在快照表没有数据时改读实时累计值，报告里写明「不是所选时间段」；实例级视图，在 postgres 库执行。只读
  login.current_db:
    - 登录核实：中间件实际连的库与账号（业务库类，带 dbName）
    - current_database() / current_user
    - 登录时带 dbName 调一次，回来的库名等于用户给的业务库，即确认中间件已按 dbName 切库；否则如实提示没切过去的原因。只读
  vacuum.xmin_holder:
    - 卡住死元组回收的事务（持有最老 xmin 的会话）
    - pg_running_xacts / pg_stat_activity / gs_txid_oldestxmin()
    - 表膨胀、vacuum 回收不掉时，指出真正持有最老 xmin 的是哪个会话、哪个应用、正在执行什么语句（原来只能列出「此刻有哪些长事务」）。不取客户端地址。只读
  vacuum.xid_lag:
    - 最老 xmin 落后当前事务号多少
    - gs_txid_oldestxmin() / gs_get_next_xid_csn()
    - 给「xmin 推不动」一个量：落后几百是正常并发，持续涨到几十万以上说明有事务长时间不结束。不分配事务号。只读
  health.xlog_position:
    - 此刻的 xlog 写入位置
    - pg_current_xlog_location()
    - 健康检查隔几秒取两次，算出 xlog 每秒生成量（此前没有任何检查能测 xlog 涨得多快）。只读
  health.table_writes:
    - 各表的插入 / 更新 / 删除行数（大字段写入折回所属表）
    - pg_stat_all_tables / pg_class / pg_namespace
    - 健康检查隔几秒取两次，得出采样期间写入最多的表；大字段（TOAST）的写入折回所属业务表单列标出，用于判断是不是大字段批量写入导致 xlog 涨得快。只读
  health.write_sql:
    - 写入行数最多的语句
    - dbe_perf.statement
    - 按语句汇总插入 + 更新 + 删除的行数（统计重置以来），找出写得最多的业务 SQL。只读
  health.write_sessions:
    - 此刻正在执行写入的会话
    - pg_stat_activity
    - 正在执行 INSERT / UPDATE / DELETE / MERGE / COPY / CALL 的会话：哪个应用、执行了多久、语句是什么。表级写入计数要等语句结束才累加，长时间的批量写入或存储过程靠这一路说出是谁在写。只读
  health.xlog_by_session:
    - 当前事务 xlog 用量最大的会话
    - pg_stat_activity.xlog_quantity
    - GaussDB 上直接给出哪个会话、哪个应用、正在执行哪条 SQL 写了多少 xlog；库里没有这一列时技能如实说明、改看表与 SQL 两路。只读
  wdr.table_writes:
    - 时间段内各表的插入 / 更新 / 删除行数
    - snapshot.snap_global_stat_all_tables / pg_class / pg_namespace
    - 两个 WDR 快照之差，回答「那段时间是哪张表在写」（强制 checkpoint 多、xlog 涨得快时追到业务表）；大字段写入折回所属表。只读
  wdr.redo_io:
    - 时间段内 redo（xlog）写入量
    - snapshot.snap_global_file_redo_iostat
    - 两个 WDR 快照之差：redo 物理写次数与写入块数，对应官方 WDR 报告的 Redo size。只读

changed:
  health.storage: >-
    **只量执行账号有权限的库与表空间**:库大小加 has_database_privilege(CONNECT)、表空间大小加 has_tablespace_privilege(CREATE)
    或「本库默认表空间」的判断,没权限的那行返回 NULL(报告写「无权限查看」)。原先对每个库、每个表空间都量,受限账号碰到
    一个没权限的就整条报错(行方 11-08 测试报告:健康检查 Storage 维度 HTTP 400)。只读。
  health.slow_sql: >-
    **多取一列 user_name**(执行账号):云平台运维账号(rdsAdmin 等)跑的监控采样 SQL 按账号排除出业务慢 SQL
    (行方 11-08 测试报告:榜首是 rdsAdmin 的 ASP 采样 SQL)。筛选、排序不变。只读。
  slowsql.slow_sql: >-
    **多取一列 user_name**(执行账号),用途同 health.slow_sql。筛选、排序不变。只读。
  topsql.top_sql: >-
    **多取一列 user_name**(执行账号):按 sql_id 聚合后,只有一个账号执行过时给出账号、几个账号都执行过给 NULL,
    用于把云平台运维账号的 SQL 排除出业务 Top SQL。筛选、排序不变。只读。
  vacuum.dead_tuples: >-
    **多取三列**：这张表的更新、HOT 更新、删除次数（pg_stat_user_tables 的 n_tup_upd / n_tup_hot_upd / n_tup_del），
    报告据此说明死元组来自哪类业务操作。筛选、排序不变。只读。
  topsql.top_sql: >-
    **多取一列**：按语句汇总的写入行数（插入 + 更新 + 删除），支持按写入排 Top SQL（xlog 涨得快、表上死元组多时找写得最多的 SQL）。
    筛选、排序方式不变。只读。
