<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>诊断大盘 - GaussDB 智能体(R6 设计原型)</title>
<link rel="preload" href="fonts/IBMPlexSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="topbar">
  <div class="logo">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/><path d="M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg></span>
    <b>GaussDB 智能体</b>
  </div>
  <button class="inst" id="inst"></button>
  <button class="cmdk-trigger" id="cmdk-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>搜索页面、SQL、维度、案例…<span class="kbd"><kbd>⌘</kbd><kbd>K</kbd></span></button>
  <div class="right">
    <span class="tag gray" title="这是设计原型,数据来自样例报告">设计原型</span>
    <button class="ask-btn" id="ask-btn"><span class="spark"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.5 4.6 2.9 7 7.5 7.5-4.6.5-7 2.9-7.5 7.5-.5-4.6-2.9-7-7.5-7.5 4.6-.5 7-2.9 7.5-7.5z"/><path d="M19 15.5c.2 1.8 1.1 2.7 2.9 2.9-1.8.2-2.7 1.1-2.9 2.9-.2-1.8-1.1-2.7-2.9-2.9 1.8-.2 2.7-1.1 2.9-2.9z" opacity=".7"/></svg></span>问智能体<span class="kbd"><kbd>⌘</kbd><kbd>J</kbd></span></button>
    <div class="user"><span class="av" id="av"></span><span id="who"></span></div>
  </div>
</header>
<div class="shell">
  <nav class="side" id="nav">
    <div class="grp">诊断大盘</div>
    <a href="#/health" data-p="health"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg>健康检查</a>
    <a href="#/topsql" data-p="topsql"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 6h16M4 12h11M4 18h6"/></svg>Top SQL</a>
    <a href="#/wdr" data-p="wdr"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/></svg>WDR 分析</a>
    <div class="grp">知识</div>
    <a href="#/kb" data-p="kb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h10a3 3 0 0 1 3 3V20H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>知识库</a>
    <div class="grp">会话</div>
    <a href="#" data-dig="新对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新对话<span class="ext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16 16 8M9 8h7v7"/></svg></span></a>
    <a href="#" data-dig="最近对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>最近对话<span class="ext"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16 16 8M9 8h7v7"/></svg></span></a>
    <div class="side-ai">
      <b>随时问智能体</b>
      <p>它能看到你当前打开的报告，回答里会标出引用的字段。</p>
      <span class="kbd"><kbd>⌘</kbd><kbd>J</kbd></span><span class="t3">打开侧栏</span>
    </div>
  </nav>
  <main class="content" id="page"></main>
</div>
<div class="tip" id="tip"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true"></aside>
<aside class="assist" id="assist" aria-label="智能体"></aside>
<div class="scrim cmdk-scrim" id="cmdk-scrim"></div>
<div class="cmdk" id="cmdk" role="dialog" aria-label="命令面板"></div>
<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="js/core.js"></script>
<script src="js/viz.js"></script>
<script src="js/health.js"></script>
<script src="js/topsql.js"></script>
<script src="js/wdr.js"></script>
<script src="js/kb.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
