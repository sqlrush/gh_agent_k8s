<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>诊断工作台 - GaussDB 智能体(R9 智能体工作台 设计原型)</title>
<link rel="preload" href="fonts/IBMPlexSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="r9.css">
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="rail-top">
      <div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/><path d="M4.5 11.5v6c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-6"/></svg></span><b>GaussDB 智能体</b></div>
      <button class="inst" id="inst"></button>
      <button class="newtask" id="cmdk-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新任务或搜索<span class="kbd"><kbd>⌘</kbd><kbd>K</kbd></span></button>
    </div>
    <nav class="rail-list" id="tasks"></nav>
    <div class="rail-foot"><span class="av" id="av"></span><span id="who"></span><span class="tag gray">设计原型</span></div>
  </aside>
  <main class="center" id="center">
    <header class="thead" id="thead"></header>
    <div class="thread" id="page"></div>
    <form class="composer" data-askform>
      <div class="cbox">
        <div class="ctx" id="ctxpill"></div>
        <div class="crow"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.5 4.6 2.9 7 7.5 7.5-4.6.5-7 2.9-7.5 7.5-.5-4.6-2.9-7-7.5-7.5 4.6-.5 7-2.9 7.5-7.5z"/><path d="M19 15.5c.2 1.8 1.1 2.7 2.9 2.9-1.8.2-2.7 1.1-2.9 2.9-.2-1.8-1.1-2.7-2.9-2.9 1.8-.2 2.7-1.1 2.9-2.9z" opacity=".7"/></svg><input name="q" autocomplete="off" placeholder="接着问，比如：先处理哪一条？"><button class="send" aria-label="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button></div>
      </div>
      <div class="chint">回答由你本人的 opencode 会话生成 · 级别以脚本判定为准 · ⌘J 聚焦这里</div>
    </form>
  </main>
  <aside class="pane" id="pane"></aside>
</div>
<div class="tip" id="tip"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>
<aside class="assist" id="assist"></aside>
<div class="scrim cmdk-scrim" id="cmdk-scrim"></div>
<div class="cmdk" id="cmdk" role="dialog" aria-label="命令面板"></div>
<div class="menu" id="menu"></div>
<div class="toast" id="toast"></div>
<script src="data.js"></script>
<script src="js/core.js"></script>
<script src="js/viz.js"></script>
<script src="js/health.js"></script>
<script src="js/topsql.js"></script>
<script src="js/wdr.js"></script>
<script src="js/kb.js"></script>
<script src="js/workspace.js"></script>
<script src="js/threads.js"></script>
<script src="js/shell.js"></script>
</body>
</html>
