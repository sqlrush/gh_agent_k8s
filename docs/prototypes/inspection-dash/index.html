<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GaussDB 智能体 · 巡检大盘（原型）</title>
<!-- 巡检大盘 UI 原型(2026-11-11):假数据、不连后端。视觉沿用现有大盘(frontend/styles/base.css,R6「智能运维舱」)。
     说明见同目录 guide.html;方案见 docs/specs/2026-11-11-inspection-design.html -->
<style>
@font-face { font-family: "Plex"; src: url(../../../frontend/fonts/IBMPlexSans-Light.woff2) format("woff2"); font-weight: 300; font-display: swap; }
@font-face { font-family: "Plex"; src: url(../../../frontend/fonts/IBMPlexSans-Regular.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Plex"; src: url(../../../frontend/fonts/IBMPlexSans-Medium.woff2) format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Plex"; src: url(../../../frontend/fonts/IBMPlexSans-SemiBold.woff2) format("woff2"); font-weight: 600; font-display: swap; }
:root {
  --sans: "Plex", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  --bg: #f4f6fa; --panel: #ffffff; --fill: #f7f8fa; --fill-2: #f0f2f5; --line: #e6e9ef; --line-2: #cfd5de;
  --t1: #1d2129; --t2: #4e5969; --t3: #86909c; --t4: #c9cdd4;
  --primary: #2462e8; --primary-hover: #1a50c8; --primary-tint: #eef3fe; --primary-line: #bed0fa;
  --ai-1: #2462e8; --ai-2: #7c5cff; --ai-3: #16b4c8; --ai-grad: linear-gradient(120deg, var(--ai-1), var(--ai-2) 55%, var(--ai-3));
  --ok: #1f9d63; --notice: #b98200; --warn: #e2621f; --crit: #d5342b; --na: #86909c;
  --ok-tint: #e8f6ee; --notice-tint: #fcf4dd; --warn-tint: #fdeee5; --crit-tint: #fcebea; --na-tint: #f0f2f5;
  --gray-mark: #dfe3ea; --track: #edf0f5;
  --h-bg-1: #0a1430; --h-bg-2: #13265a; --h-t1: #f3f6fb; --h-t2: #b6c2d9; --h-t3: #8492ad;
  --h-glass: rgba(255,255,255,.07); --h-glass-line: rgba(255,255,255,.13);
  --h-ok: #4cc38a; --h-notice: #e8b84a; --h-warn: #f2925a; --h-crit: #f26b63; --h-na: #8b95a8;
  --r-xl: 22px; --r-lg: 18px; --r-md: 12px;
  --shadow-1: 0 1px 2px rgba(17,24,39,.04), 0 4px 16px rgba(17,24,39,.04);
  --shadow-2: 0 18px 50px rgba(10,20,48,.22), 0 2px 6px rgba(10,20,48,.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--sans); font-size: 14px; line-height: 1.5715; color: var(--t1); background: var(--bg); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--primary); text-decoration: none; cursor: pointer; } a:hover { color: var(--primary-hover); }
.num { font-variant-numeric: tabular-nums; } .t2 { color: var(--t2); } .t3 { color: var(--t3); }
[hidden] { display: none !important; }
[data-lv="0"] { --c: var(--ok); --ct: var(--ok-tint); --hc: var(--h-ok); } [data-lv="1"] { --c: var(--notice); --ct: var(--notice-tint); --hc: var(--h-notice); }
[data-lv="2"] { --c: var(--warn); --ct: var(--warn-tint); --hc: var(--h-warn); } [data-lv="3"] { --c: var(--crit); --ct: var(--crit-tint); --hc: var(--h-crit); }
[data-lv="na"] { --c: var(--na); --ct: var(--na-tint); --hc: var(--h-na); }
.glyph { display: inline-flex; color: var(--c); flex: none; } .glyph svg { width: 16px; height: 16px; }
.hero .glyph { color: var(--hc); }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; line-height: 1; white-space: nowrap; background: var(--ct, var(--fill-2)); color: var(--t1); }
.tag .glyph svg { width: 13px; height: 13px; }
.tag.blue { background: var(--primary-tint); color: var(--primary); } .tag.gray { background: var(--fill-2); color: var(--t2); }
.tag.line { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--t2); }
.tag.pur { background: #f1edff; color: #5b3fd6; } .tag.cyan { background: #e4f7fa; color: #0c7f8f; }

/* 骨架 */
.topbar { position: sticky; top: 0; z-index: 30; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 16px;
  background: rgba(255,255,255,.72); backdrop-filter: blur(20px) saturate(170%); -webkit-backdrop-filter: blur(20px) saturate(170%); border-bottom: 1px solid rgba(17,24,39,.06); }
.logo { display: flex; align-items: center; gap: 10px; width: 200px; }
.logo .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--ai-grad); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 12px rgba(36,98,232,.35); }
.logo .mark svg { width: 17px; height: 17px; } .logo b { font-size: 15px; font-weight: 600; }
.pick { height: 34px; padding: 0 10px 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; }
.pick:hover { border-color: var(--primary-line); }
.pick span { color: var(--t3); font-size: 12.5px; }
.pick select { border: 0; background: transparent; outline: 0; cursor: pointer; font-size: 13.5px; padding-right: 2px; }
.topbar .right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.user { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.user .av { width: 30px; height: 30px; border-radius: 50%; background: var(--primary-tint); color: var(--primary); display: grid; place-items: center; font-size: 12.5px; font-weight: 600; }
.shell { display: grid; grid-template-columns: 220px minmax(0,1fr); min-height: calc(100vh - 60px); }
.side { position: sticky; top: 60px; height: calc(100vh - 60px); padding: 14px 10px; overflow: auto; border-right: 1px solid var(--line); background: rgba(255,255,255,.6); }
.side .grp { font-size: 12px; color: var(--t3); padding: 14px 12px 6px; }
.side a { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border-radius: 10px; color: var(--t2); font-size: 14px; }
.side a svg { width: 17px; height: 17px; flex: none; }
.side a:hover { background: var(--fill-2); color: var(--t1); }
.side a.on { background: var(--panel); color: var(--primary); font-weight: 500; box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line); }
.side a .cnt { margin-left: auto; font-size: 12px; min-width: 20px; height: 20px; border-radius: 10px; display: grid; place-items: center; padding: 0 6px; background: var(--crit-tint); color: var(--crit); font-weight: 500; }
.side a .ext { margin-left: auto; color: var(--t3); display: inline-flex; } .side a .ext svg { width: 13px; height: 13px; }
.content { padding: 18px 28px 56px; min-width: 0; max-width: 1560px; }
.crumb { font-size: 13px; color: var(--t3); display: flex; gap: 8px; align-items: center; } .crumb b { color: var(--t1); font-weight: 400; }
.page-head { display: flex; align-items: center; gap: 12px; margin: 8px 0 4px; }
.page-head h1 { margin: 0; font-size: 22px; line-height: 30px; font-weight: 600; }
.page-head .actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.page-desc { display: flex; flex-wrap: wrap; gap: 4px 24px; font-size: 13px; color: var(--t2); margin-bottom: 16px; } .page-desc b { color: var(--t1); font-weight: 400; }
.btn { height: 34px; padding: 0 15px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--panel); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
.btn:hover { color: var(--primary); border-color: var(--primary); } .btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; box-shadow: 0 6px 16px rgba(36,98,232,.28); }
.btn.primary:hover { background: var(--primary-hover); color: #fff; }
.btn.sm { height: 28px; padding: 0 10px; font-size: 13px; border-radius: 8px; }
.seg { display: inline-flex; background: var(--fill-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; height: 28px; padding: 0 12px; border-radius: 7px; font-size: 13px; color: var(--t2); cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--panel); color: var(--primary); box-shadow: var(--shadow-1); font-weight: 500; }

/* 主视觉带 */
.hero { position: relative; border-radius: var(--r-xl); padding: 22px; color: var(--h-t1); overflow: hidden; isolation: isolate; margin-bottom: 18px;
  background: radial-gradient(900px 380px at 12% -10%, rgba(36,98,232,.55), transparent 60%), radial-gradient(700px 360px at 88% 0%, rgba(124,92,255,.38), transparent 62%),
              radial-gradient(600px 300px at 60% 120%, rgba(22,180,200,.28), transparent 60%), linear-gradient(160deg, var(--h-bg-1), var(--h-bg-2)); }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .35; background-image: radial-gradient(rgba(255,255,255,.10) 1px, transparent 1px); background-size: 22px 22px; mask-image: linear-gradient(180deg, #000, transparent 85%); }
.hero-grid { display: grid; grid-template-columns: minmax(0,.85fr) minmax(0,1.6fr); gap: 18px; }
.glass { background: var(--h-glass); border: 1px solid var(--h-glass-line); border-radius: var(--r-lg); backdrop-filter: blur(18px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 10px 30px rgba(0,0,0,.18); }
.hero .k { font-size: 12.5px; color: var(--h-t2); } .hero .t3 { color: var(--h-t3); } .hero a { color: #a9c3ff; }
.ringbox { padding: 18px 18px 16px; display: flex; flex-direction: column; align-items: center; }
.ringbox .title { align-self: stretch; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--h-t2); }
.ring { width: 230px; height: 230px; margin: 10px 0 6px; }
.ring text { font-family: var(--sans); }
.ring-legend { display: flex; gap: 6px 16px; flex-wrap: wrap; justify-content: center; font-size: 13.5px; color: var(--h-t2); }
.ring-legend span { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; } .ring-legend b { color: var(--h-t1); font-weight: 600; }
.ring-legend .glyph svg { width: 14px; height: 14px; }
.insight { position: relative; padding: 18px 20px 16px; display: flex; flex-direction: column; }
.insight::before { content: ""; position: absolute; inset: 0; border-radius: var(--r-lg); padding: 1px; background: linear-gradient(120deg, rgba(122,162,255,.9), rgba(160,136,255,.7) 50%, rgba(80,210,225,.8));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; pointer-events: none; }
.insight .who { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--h-t2); }
.insight .who .orb { width: 22px; height: 22px; border-radius: 7px; background: var(--ai-grad); display: grid; place-items: center; box-shadow: 0 0 18px rgba(124,92,255,.55); }
.insight .who .orb svg { width: 13px; height: 13px; color: #fff; } .insight .who b { color: var(--h-t1); font-weight: 600; font-size: 14px; }
.insight .who .src { margin-left: auto; font-size: 12px; color: var(--h-t3); }
.insight h2 { margin: 12px 0 0; font-size: 20px; line-height: 1.5; font-weight: 600; }
.insight .lines { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 7px; }
.insight .lines li { font-size: 14px; color: var(--h-t2); line-height: 1.65; display: flex; gap: 8px; }
.insight .lines li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: #9db8ff; margin-top: 9px; flex: none; }
.insight .lines b { color: var(--h-t1); font-weight: 500; }
.ev { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; margin: 0 2px; border-radius: 6px; font-size: 12px; color: var(--h-t1); background: rgba(255,255,255,.10); border: 1px solid rgba(255,255,255,.16); cursor: pointer; vertical-align: 1px; }
.ev:hover { background: rgba(255,255,255,.18); } .ev .glyph svg { width: 12px; height: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 14px; }
.chip-ask { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: var(--h-t1); font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip-ask:hover { background: rgba(255,255,255,.14); } .chip-ask svg { width: 13px; height: 13px; color: #b9a8ff; }
.hero-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-top: 16px; }
.hero-stats > div { padding: 12px 16px; }
.hero-stats .l { font-size: 12.5px; color: var(--h-t2); display: flex; align-items: center; gap: 6px; }
.hero-stats .v { font-size: 26px; font-weight: 500; line-height: 1.25; margin-top: 4px; } .hero-stats .v small { font-size: 12.5px; color: var(--h-t3); font-weight: 400; margin-left: 4px; }
.hero-stats .s { font-size: 12px; color: var(--h-t3); margin-top: 2px; }
.d-up { color: var(--h-crit); } .d-dn { color: var(--h-ok); }

/* 便当盒 */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); gap: 18px; margin-bottom: 18px; }
.b4 { grid-column: span 4; } .b5 { grid-column: span 5; } .b6 { grid-column: span 6; } .b7 { grid-column: span 7; } .b8 { grid-column: span 8; } .b12 { grid-column: span 12; }
.tile { background: var(--panel); border-radius: var(--r-lg); box-shadow: var(--shadow-1); border: 1px solid rgba(17,24,39,.04); min-width: 0; display: flex; flex-direction: column; }
.tile-h { display: flex; align-items: center; gap: 10px; padding: 18px 20px 0; min-height: 50px; flex-wrap: wrap; }
.tile-h h3 { margin: 0; font-size: 15.5px; font-weight: 600; white-space: nowrap; }
.tile-h .desc { font-size: 12.5px; color: var(--t3); }
.tile-h .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tile-b { padding: 14px 20px 20px; flex: 1; } .tile-b.flush { padding: 6px 0 6px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { text-align: left; font-weight: 500; color: var(--t3); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; font-size: 12.5px; cursor: default; }
.tbl th.sort { cursor: pointer; } .tbl th.sort:hover { color: var(--primary); }
.tbl td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
.tbl tbody tr { cursor: pointer; } .tbl tbody tr:last-child td { border-bottom: 0; } .tbl tbody tr:hover td { background: #f8faff; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; } .tbl .ops { text-align: right; } .tbl .ops a + a { margin-left: 12px; }
.tbl td.wrap { white-space: normal; min-width: 180px; }
.tile-b.flush .tbl th:first-child, .tile-b.flush .tbl td:first-child { padding-left: 20px; }
.tile-b.flush .tbl th:last-child, .tile-b.flush .tbl td:last-child { padding-right: 20px; }
.rk { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; background: var(--fill-2); color: var(--t2); font-size: 12.5px; font-weight: 600; }
.rk.top { background: var(--crit-tint); color: var(--crit); }
.dbn b { font-weight: 500; } .dbn small { display: block; color: var(--t3); font-size: 12px; }
.valbar { display: flex; align-items: center; gap: 10px; min-width: 210px; }
.valbar .b { flex: 1; height: 6px; border-radius: 3px; background: var(--track); position: relative; }
.valbar .b i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--c, var(--primary)); min-width: 2px; }
.valbar b { font-weight: 500; font-variant-numeric: tabular-nums; min-width: 86px; text-align: right; } .valbar b small { color: var(--t3); font-weight: 400; margin-left: 2px; font-size: 12px; }
.pct { font-size: 12.5px; color: var(--t2); } .pct.hi { color: var(--crit); font-weight: 500; }
.delta { font-size: 12.5px; font-variant-numeric: tabular-nums; } .delta.up { color: var(--crit); } .delta.dn { color: var(--ok); } .delta.flat { color: var(--t3); }
.instchip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--t2); background: var(--fill); border: 1px solid var(--line); height: 22px; padding: 0 7px; border-radius: 6px; }
.instchip .glyph svg { width: 12px; height: 12px; }
.hb .r { display: grid; grid-template-columns: minmax(0,150px) minmax(0,1fr) 70px; gap: 12px; align-items: center; padding: 7px 0; font-size: 13.5px; cursor: pointer; }
.hb .r:hover .l { color: var(--primary); }
.hb .r .l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .hb .r .l small { display: block; color: var(--t3); font-size: 12px; }
.hb .r .b { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--track); gap: 2px; }
.hb .r .b i { display: block; height: 100%; background: var(--c); }
.hb .r .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--t2); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--t2); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; } .legend .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
.trend { width: 100%; height: auto; display: block; }
.trend text { fill: var(--t3); font-size: 11px; font-family: var(--sans); }
.trend .bar { cursor: pointer; } .trend .bar:hover rect { opacity: .85; } .trend .cur rect.frame { stroke: var(--primary); stroke-width: 2; fill: none; }
.note { font-size: 12.5px; color: var(--t2); background: var(--fill); border-radius: 10px; padding: 10px 12px; margin-top: 14px; line-height: 1.6; }
.note b { color: var(--t1); font-weight: 500; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 14px; }
.filters input { height: 32px; border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; background: var(--panel); width: 220px; outline: 0; }
.filters input:focus { border-color: var(--primary-line); }
.lvchip { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); display: inline-flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; color: var(--t2); }
.lvchip.on { border-color: var(--c, var(--primary)); background: var(--ct, var(--primary-tint)); color: var(--t1); }
.lvchip .glyph svg { width: 13px; height: 13px; }
.scopebanner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--primary-tint); color: var(--t2); font-size: 13px; margin-bottom: 14px; border: 1px solid var(--primary-line); }
.scopebanner.inst { background: #f4f1ff; border-color: #d9ceff; }
.prog { width: 140px; height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; display: inline-block; vertical-align: middle; }
.prog i { display: block; height: 100%; background: var(--primary); border-radius: 3px; transition: width .4s; }
.prog.part i { background: var(--warn); }
.st { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap; }
.st i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--t3)); }
.st.run i { background: var(--primary); box-shadow: 0 0 0 4px var(--primary-tint); animation: pulse 1.4s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(36,98,232,.08); } }
/* 抽屉 */
.mask { position: fixed; inset: 0; background: rgba(10,20,48,.28); z-index: 50; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; max-width: 94vw; background: var(--panel); z-index: 51; box-shadow: var(--shadow-2); display: flex; flex-direction: column; }
.drawer .dh { padding: 18px 22px 12px; border-bottom: 1px solid var(--line); }
.drawer .dh .x { float: right; border: 0; background: transparent; font-size: 20px; color: var(--t3); cursor: pointer; }
.drawer .dh h2 { margin: 0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.drawer .dh .meta { font-size: 12.5px; color: var(--t3); margin-top: 4px; }
.drawer .db { padding: 16px 22px 24px; overflow: auto; flex: 1; }
.drawer .df { padding: 12px 22px; border-top: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; }
.fnd { border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; margin-bottom: 10px; }
.fnd .h { display: flex; align-items: center; gap: 8px; } .fnd .h b { font-weight: 500; } .fnd .h code { margin-left: auto; font-size: 11.5px; color: var(--t3); }
.fnd .m { font-size: 12.5px; color: var(--t2); margin-top: 4px; } .fnd .e { font-size: 12.5px; color: var(--t3); margin-top: 2px; }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; margin: 4px 0 14px; }
.kv div { background: var(--fill); border-radius: 10px; padding: 8px 10px; } .kv small { display: block; color: var(--t3); font-size: 12px; } .kv b { font-weight: 500; font-variant-numeric: tabular-nums; }

<script>
'use strict';
/* ---------------------------------------------------------------- 小工具 */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const G = {

  1: '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="currentColor"/><path d="M8 4.6v4.1" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.2" r=".95" fill="#fff"/></svg>',
  2: '<svg viewBox="0 0 16 16"><path d="M7.1 1.9a1 1 0 0 1 1.8 0l6.2 11.2a1 1 0 0 1-.9 1.5H1.8a1 1 0 0 1-.9-1.5z" fill="currentColor"/><path d="M8 6v3.6" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="8" cy="11.8" r=".9" fill="#fff"/></svg>',

  na: '<svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2.4 2"/><path d="M5.4 8h5.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
};
const LVN = { 3: '严重', 2: '告警', 1: '关注', 0: '正常', na: '未采到' };
const lk = (l) => (l === null || l === undefined ? 'na' : String(l));
const glyph = (l) => `<span class="glyph" data-lv="${lk(l)}">${G[lk(l)]}</span>`;
const tag = (l, t) => `<span class="tag" data-lv="${lk(l)}">${glyph(l)}${esc(t ?? LVN[lk(l)])}</span>`;
const sv = (d) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const I = {
  home: sv('<path d="M4 11 12 4l8 7v8a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>'),
  rank: sv('<path d="M5 20V10M12 20V4M19 20v-7"/>'),
  task: sv('<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 9h8M8 13h8M8 17h5"/>'),
  bell: sv('<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>'),
  list: sv('<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'),
  heart: sv('<path d="M3 12h4l2.5-6 4 12 2.5-6H21"/>'),
  sql: sv('<path d="M5 6h14M5 12h14M5 18h9"/>'),
  wdr: sv('<path d="M4 19h16M7 16V9M12 16V5M17 16v-4"/>'),
  chat: sv('<path d="M4 5h16v11H9l-5 4z"/>'),
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 16 16 8M9 8h7v7"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5c.5 4.6 2.9 7 7.5 7.5-4.6.5-7 2.9-7.5 7.5-.5-4.6-2.9-7-7.5-7.5 4.6-.5 7-2.9 7.5-7.5z"/></svg>',
};
function rng(seed) { return () => { seed |= 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const fmt = (v, d = 0) => (v === null || v === undefined || Number.isNaN(v) ? '—' : Number(v).toLocaleString('zh-CN', { maximumFractionDigits: d, minimumFractionDigits: d }));

/* ---------------------------------------------------------------- 假数据(全部虚构;地址用 10.0.0.x 占位) */
const IDCS = [{ id: 'IDC-A', name: 'IDC-A 主中心' }, { id: 'IDC-B', name: 'IDC-B 同城中心' }];
const APPS = [
  { id: 'APP-0101', name: '核心账务', owner: '账务运维组', inst: 8, dbs: ['acct', 'ledger', 'bill', 'settle', 'acctarc', 'rpt', 'intf', 'cfg'] },
  { id: 'APP-0203', name: '支付清算', owner: '支付运维组', inst: 6, dbs: ['pay', 'clear', 'route', 'risk', 'recon', 'notify'] },
  { id: 'APP-0310', name: '客户信息', owner: '客户运维组', inst: 4, dbs: ['cust', 'kyc', 'tag', 'contact', 'auth'] },
  { id: 'APP-0412', name: '渠道网关', owner: '渠道运维组', inst: 3, dbs: ['gw', 'session', 'audit'] },
];
const FIND = [
  { code: 'LONG_IDLE_XACT', dim: '长事务与空闲事务', metric: '空闲事务最长时长', unit: '秒', thr: '600', scope: 'db' },
  { code: 'DEAD_TUPLE_HIGH', dim: '死元组与膨胀', metric: '死元组比', unit: '%', thr: '20', scope: 'db' },
  { code: 'STALE_STATS', dim: 'Schema / 对象', metric: '统计信息陈旧表', unit: '张', thr: '5', scope: 'db' },
  { code: 'INVALID_INDEX', dim: 'Schema / 对象', metric: '失效索引', unit: '个', thr: '0', scope: 'db' },
  { code: 'SLOW_SQL_SPIKE', dim: 'Slow SQL', metric: '24 小时慢 SQL', unit: '条', thr: '200', scope: 'db' },
  { code: 'ROLLBACK_RATIO_HIGH', dim: '事务 / 并发', metric: '回滚率', unit: '%', thr: '5', scope: 'db' },
  { code: 'TEMP_FILE_SPIKE', dim: 'IO / 临时文件', metric: '临时文件', unit: 'MB', thr: '2048', scope: 'db' },
  { code: 'LOCK_CHAIN', dim: '锁阻塞链', metric: '最长阻塞', unit: '秒', thr: '30', scope: 'inst' },
  { code: 'CONN_NEAR_LIMIT', dim: '连接', metric: '连接使用率', unit: '%', thr: '80', scope: 'inst' },
  { code: 'REPL_LAG', dim: '复制 / 备机', metric: '复制延迟', unit: '秒', thr: '10', scope: 'inst' },
  { code: 'CKPT_REQ_HIGH', dim: '检查点 / WAL', metric: '请求型检查点占比', unit: '%', thr: '30', scope: 'inst' },
];
const RUNS_N = 14;
function buildRuns() {
  const now = new Date('2026-11-11T02:00:00+08:00').getTime();
  const out = [];
  for (let i = 0; i < RUNS_N; i++) {
    const t = new Date(now - (RUNS_N - 1 - i) * 86400000);
    out.push({ id: 'r-' + t.toISOString().slice(0, 10).replace(/-/g, '') + '-0200', at: t, trigger: 'task', profile: i % 7 === 6 ? 'deep' : 'daily' });

}
const RUNS = buildRuns();
function buildTargets() {
  const r = rng(20261111); const insts = []; const dbs = []; let ip = 20;
  APPS.forEach((app, ai) => {
    for (let k = 0; k < app.inst; k++) {
      const idc = IDCS[k % 2 === 0 || ai === 3 ? 0 : 1].id; ip += 1;
      const inst = { ip: '10.0.0.' + ip, app: app.id, idc, role: k % 3 === 2 ? '备' : '主', spec: ['8C32G', '16C64G', '32C128G'][Math.floor(r() * 3)], dbs: [] };
      insts.push(inst);
      const ndb = 1 + Math.floor(r() * 3);
      for (let j = 0; j < ndb; j++) {
        const name = app.dbs[(k + j * 3) % app.dbs.length] + (j > 0 && r() > 0.6 ? '_h' : '') + (k > 3 ? String(k) : '');
        const db = { key: inst.ip + '/' + name, name, inst: inst.ip, app: app.id, idc, role: inst.role, seed: Math.floor(r() * 1e9) };
        inst.dbs.push(name); dbs.push(db);
      }
    }
  });
  return { insts, dbs };
}
const T = buildTargets();
/** 某次巡检里某个库 / 实例的结果(按 run 序号确定性生成,让趋势有变化) */
function dbResult(db, ri) {
  const r = rng(db.seed + ri * 7919); const base = rng(db.seed);
  const size = 20 + base() * 900, tpsBase = 20 + base() * 1800, hot = base();
  // 每项指标各自一个「体质」,让不同的库毛病不同(全是同一个 hot 时每个库都长一个样)
  const hIdle = base() ** 3, hDead = base() ** 1.6, hSlow = base() ** 1.4, hRb = base() ** 3, hTemp = base() ** 2.5, hHit = base() ** 3, hStale = base() ** 1.8, hInv = base();
  const drift = Math.sin((ri + hot * 9) / 2.3);
  const m = {
    slow_cnt: Math.round(Math.max(0, hSlow * 560 + drift * 90 + r() * 60)), slow_total_s: 0,
    tps: tpsBase * (0.85 + r() * 0.3), rollback: Math.max(0.1, hRb * 11 + drift * 1.2 + r() * 0.8),
    deadlocks: Math.max(0, Math.round(hRb * 8 + drift * 2 - 2 + r() * 2)), temp_mb: Math.round(Math.max(0, hTemp * 4600 + drift * 500 + r() * 300 - 400)),
    hit: Math.min(99.99, 99.95 - hHit * 3.6 - Math.max(0, drift) * 0.6 - r() * 0.3), size_gb: size + ri * size * 0.004,
    growth_gb: Math.max(0, size * (0.002 + hot * 0.02) * (0.7 + r() * 0.6)), dead: Math.max(0.5, hDead * 42 + drift * 5 + r() * 3),
    stale: Math.max(0, Math.round(hStale * 15 + drift * 3 + r() * 2 - 3)), invalid_idx: hInv > 0.9 ? 1 + Math.floor(r() * 2) : 0,
    sess: Math.round(10 + hot * 260 + r() * 40), idle_xact_s: Math.round(Math.max(0, hIdle * 2300 + drift * 300 + r() * 200 - 250)),
    tx_sample: Math.round(tpsBase * 3600),
  };
  m.slow_total_s = Math.round(m.slow_cnt * (0.8 + hSlow * 4));
  if (hot < 0.08) m.tx_sample = 600;
  const fs = [];
  const add = (code, sev, val, ev) => { const f = FIND.find((x) => x.code === code); fs.push({ ...f, sev, value: val, evidence: ev }); };
  if (m.idle_xact_s > 600) add('LONG_IDLE_XACT', m.idle_xact_s > 1200 ? 3 : 2, m.idle_xact_s, `会话 pid=4${(db.seed % 9000) + 1000} 应用 batch-job 空闲事务持有快照 ${m.idle_xact_s} 秒`);
  if (m.dead > 20) add('DEAD_TUPLE_HIGH', m.dead > 35 ? 2 : 1, m.dead.toFixed(1), `表 ${db.name}.t_order_detail 死元组 ${m.dead.toFixed(1)}%,上次 autovacuum 3 天前`);
  if (m.stale > 5) add('STALE_STATS', 1, m.stale, `${m.stale} 张表的统计信息超过 7 天未更新且变化行数 > 10%`);
  if (m.invalid_idx > 0) add('INVALID_INDEX', 2, m.invalid_idx, `索引 idx_${db.name}_ref 状态为失效(建索引中断)`);
  if (m.slow_cnt > 200) add('SLOW_SQL_SPIKE', m.slow_cnt > 400 ? 2 : 1, m.slow_cnt, `24 小时慢 SQL ${m.slow_cnt} 条,总耗时 ${m.slow_total_s} 秒(SQL 执行历史按库归属)`);
  if (m.rollback > 5 && m.tx_sample >= 1000) add('ROLLBACK_RATIO_HIGH', m.rollback > 8 ? 2 : 1, m.rollback.toFixed(1), `回滚 ${m.rollback.toFixed(1)}%,样本 ${fmt(m.tx_sample)} 个事务`);
  if (m.temp_mb > 2048) add('TEMP_FILE_SPIKE', 1, m.temp_mb, `24 小时临时文件 ${fmt(m.temp_mb)} MB(排序 / 哈希落盘)`);
  // 少量「没切到业务库 / 采集失败」,演示未采到
  const na = (db.seed % 23 === 0 && ri >= RUNS_N - 3) ? '库级维度未采到:没切到业务库(白名单未导入 dbName 增量)' : (db.seed % 31 === 0 && ri === RUNS_N - 1 ? '采集超时(单库任务 5 分钟上限)' : '');
  const level = na && fs.length === 0 ? null : fs.reduce((a, f) => Math.max(a, f.sev), 0);

}
function instResult(inst, ri) {
  const r = rng(parseInt(inst.ip.split('.')[3], 10) * 131 + ri * 17); const hot = rng(parseInt(inst.ip.split('.')[3], 10) * 977)();
  const m = { dbtime: Math.round(800 + hot * 9000 + r() * 1200), wal: +(0.5 + hot * 18 + r() * 2).toFixed(1), repl: inst.role === '备' ? +(hot * 22 * r()).toFixed(1) : 0,
    conn: Math.round(22 + hot * 70 + r() * 8), ckpt: Math.round(hot * 55 * r()), lock_s: Math.round(Math.max(0, hot * 90 * r() - 20)),

          { id: String(2000000000 + (inst.ip.length * 104729) % 99999999), q: 'SELECT … FROM t_acct_flow WHERE acct_no = $1 AND biz_date BETWEEN $2 AND $3', share: 9 + hot * 12 }] };
  const fs = [];
  const add = (code, sev, val, ev) => { const f = FIND.find((x) => x.code === code); fs.push({ ...f, sev, value: val, evidence: ev }); };
  if (m.conn > 80) add('CONN_NEAR_LIMIT', m.conn > 90 ? 3 : 2, m.conn, `连接 ${m.conn}% (max_connections 实例级),前三名应用占 71%`);
  if (m.lock_s > 30) add('LOCK_CHAIN', 2, m.lock_s, `阻塞链深度 3,头部会话持锁 ${m.lock_s} 秒`);
  if (m.repl > 10) add('REPL_LAG', m.repl > 18 ? 3 : 2, m.repl, `备机回放延迟 ${m.repl} 秒`);
  if (m.ckpt > 30) add('CKPT_REQ_HIGH', 1, m.ckpt, `请求型检查点 ${m.ckpt}%,WAL 生成 ${m.wal} MB/s`);
  return { inst, m, fs, level: fs.reduce((a, f) => Math.max(a, f.sev), 0) };
}

/* ---------------------------------------------------------------- 状态 */
const S = { idc: 'all', app: 'APP-0101', run: RUNS.length - 1, page: 'overview', dim: 'level', board: 'db', lv: new Set(), q: '', sortDesc: true, extraRuns: [] };
const inScope = (x) => (S.idc === 'all' || x.idc === S.idc) && (S.app === 'all' || x.app === S.app);
const appName = (id) => (APPS.find((a) => a.id === id) || { name: id }).name;
function snapshot(ri) {
  const dbs = T.dbs.filter(inScope).map((d) => dbResult(d, ri));
  const insts = T.insts.filter(inScope).map((i) => instResult(i, ri));

function diffIssues(cur, prev) {
  const key = (r, f) => r.db.key + '|' + f.code;
  const p = new Set(prev.dbs.flatMap((r) => r.fs.map((f) => key(r, f))));
  const c = new Set(cur.dbs.flatMap((r) => r.fs.map((f) => key(r, f))));
  let n = 0, o = 0; c.forEach((k) => (p.has(k) ? o++ : n++)); let g = 0; p.forEach((k) => { if (!c.has(k)) g++; });
  return { new: n, ongoing: o, resolved: g, isNew: (r, f) => !p.has(key(r, f)) };

const cntLv = (rows) => { const c = { 3: 0, 2: 0, 1: 0, 0: 0, na: 0 }; rows.forEach((r) => c[lk(r.level)]++); return c; };

/* ---------------------------------------------------------------- 骨架 */
function renderPickers() {

    items.map(([k, n, ic, c]) => `<a data-p="${k}" class="${S.page === k ? 'on' : ''}">${ic}${n}${c ? `<span class="cnt">${c}</span>` : ''}</a>`).join('') +
    `<div class="grp">单库大盘(现有)</div>
     <a data-ext="health">${I.heart}健康检查<span class="ext">${I.ext}</span></a>

  let prof = '快检';
  document.getElementById('layer').innerHTML = `<div class="mask" id="mask"></div><div class="modal"><h2>发起巡检</h2>
  <label>套餐</label><div class="opts">${[['快检', '约 10 秒 / 实例 · 只看此刻'], ['日检', '约 30 秒 / 实例 + 每库 5 秒'], ['深检', '约 1 分钟 / 实例 · 含 7 天 WDR']].map(([n, s]) => `<div class="opt ${n === prof ? 'on' : ''}" data-prof="${n}"><b>${n}</b><small>${s}</small></div>`).join('')}</div>
  <label>范围</label><select id="nScope"><option>${S.app === 'all' ? '全部应用' : esc(appName(S.app)) + ' ' + S.app}</option>${APPS.map((a) => `<option>${esc(a.name)} ${a.id}</option>`).join('')}<option>指定实例 / 库…</option></select>
  <label>原因(记审计)</label><input type="text" id="nWhy" placeholder="例如:CHG-1112 上线后复核">
  <div class="note">以巡检服务账号执行(只读、白名单),审计记发起人「张工」与原因。同一实例串行,中间件调用限速;日检 / 深检建议在巡检窗口内跑。</div>
  <div class="foot"><button class="btn" id="nCancel">取消</button><button class="btn primary" id="nGo">发起</button></div></div>`;
  document.getElementById('mask').onclick = closeLayer; document.getElementById('nCancel').onclick = closeLayer;
  document.querySelectorAll('.opt').forEach((o) => (o.onclick = () => { prof = o.dataset.prof; document.querySelectorAll('.opt').forEach((x) => x.classList.toggle('on', x === o)); }));
  document.getElementById('nGo').onclick = () => {
    const r = { id: 'r-20261111-' + String(Date.now()).slice(-4) + '-new', at: new Date(), trigger: '外部调用', name: '手动发起:' + (document.getElementById('nWhy').value || '未填原因'), profile: prof, scope: document.getElementById('nScope').value, status: '排队', prog: 0, dur: null, issues: null, cov: null };
    S.extraRuns.unshift(r); closeLayer(); S.page = 'runs'; render(); toast('已发起:' + r.id + '(原型里会模拟进度)');
    let p = 0; const t = setInterval(() => { p += 20; r.status = p >= 100 ? '完成' : '进行中'; r.prog = Math.min(100, p); if (p >= 100) { r.dur = prof === '快检' ? 12 : 88; r.issues = 3; r.cov = 100; clearInterval(t); } if (S.page === 'runs') render(); }, 900);
  };
}
let toastT;
function toast(msg) { let t = document.querySelector('.toast'); if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); } t.textContent = msg; clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 4200); }
function deepMsg(what) { return `新标签页打开对话(以你的身份,复用现有「深挖」):首句 =「${what},巡检 ${RUNS[S.run].id} 的结论与证据编号已附上,请继续诊断」`; }

/* ---------------------------------------------------------------- 事件 */
function bindActions(root) {
  root.querySelectorAll('[data-go]').forEach((el) => (el.onclick = (e) => { e.stopPropagation(); S.page = el.dataset.go; if (el.dataset.dim) { S.dim = el.dataset.dim; S.board = 'db'; } if (el.dataset.board) { S.board = el.dataset.board; S.dim = 'dbtime'; } render(); window.scrollTo(0, 0); }));
  root.querySelectorAll('[data-drill]').forEach((el) => (el.onclick = (e) => { e.stopPropagation(); const k = el.dataset.drill; const [ip, db] = k.split('/'); toast(`新标签页打开现有单库健康大盘:/dash/health?src=inspect&key=api/${ip.replace(/\./g, '-')}-${db}`); }));
  root.querySelectorAll('[data-drilli]').forEach((el) => (el.onclick = (e) => { e.stopPropagation(); const ip = el.dataset.drilli; toast(`新标签页打开现有单库大盘:/dash/${el.dataset.w || 'topsql'}?src=inspect&key=api/${ip.replace(/\./g, '-')}-postgres(实例级)`); }));
  root.querySelectorAll('[data-deepdb]').forEach((el) => (el.onclick = (e) => { e.stopPropagation(); toast(deepMsg('登录 ' + el.dataset.deepdb.replace('/', ' 的 ') + ' 库')); }));
  root.querySelectorAll('[data-deepi]').forEach((el) => (el.onclick = (e) => { e.stopPropagation(); toast(deepMsg('登录实例 ' + el.dataset.deepi)); }));
  root.querySelectorAll('[data-deepa]').forEach((el) => (el.onclick = (e) => { e.stopPropagation(); toast(el.textContent.includes('↗') ? '打开 insp-bot 自动开的深挖会话(只读查看)' : deepMsg('告警 ' + el.dataset.deepa)); }));
  root.querySelectorAll('[data-runid]').forEach((el) => (el.onclick = (e) => { e.stopPropagation(); S.page = 'runs'; S.trig = '监控告警'; render(); toast('巡检记录 ' + el.dataset.runid); }));
  root.querySelectorAll('[data-dbk]').forEach((el) => (el.onclick = (e) => { e.stopPropagation(); openDb(el.dataset.dbk); }));
  root.querySelectorAll('[data-toast]').forEach((el) => (el.onclick = () => toast(el.dataset.toast)));
  root.querySelectorAll('[data-deep]').forEach((el) => (el.onclick = () => { const w = [...snapshot(S.run).dbs].sort(levelCmp)[0]; toast(deepMsg('登录 ' + w.db.inst + ' 的 ' + w.db.name + ' 库,看长事务与死元组')); }));
  root.querySelectorAll('[data-cmp]').forEach((el) => (el.onclick = () => { S.run = Math.max(0, S.run - 7); render(); toast('已切到上周同一天的巡检,可在顶部「巡检」再切回'); }));
  root.querySelectorAll('[data-app]').forEach((el) => (el.onclick = () => { S.app = el.dataset.app; render(); }));
  root.querySelectorAll('.ring-legend [data-lvf]').forEach((el) => (el.onclick = () => { S.page = 'rank'; S.board = 'db'; S.dim = 'level'; S.lv = new Set([el.dataset.lvf]); render(); }));
  root.querySelectorAll('.trend .bar').forEach((el) => (el.onclick = () => { S.run = +el.dataset.run; render(); }));
  root.querySelectorAll('tr[data-db]').forEach((el) => (el.onclick = () => openDb(el.dataset.db)));
  root.querySelectorAll('tr[data-inst]').forEach((el) => (el.onclick = () => { const ip = el.dataset.inst; const first = T.dbs.find((d) => d.inst === ip); if (first) openDb(first.key); }));
  root.querySelectorAll('tr[data-ri]').forEach((el) => (el.onclick = () => { if (el.dataset.ri !== '') { S.run = +el.dataset.ri; S.page = 'overview'; render(); window.scrollTo(0, 0); } else toast('外部调用 / 告警的快检记录:只含指定范围,打开后显示该次的库与发现'); }));
  root.querySelectorAll('tr[data-alert]').forEach((el) => (el.onclick = () => { const a = ALERTS.find((x) => x.id === el.dataset.alert); const k = a.db ? T.dbs.find((d) => d.inst === a.inst && d.name.startsWith(a.db)) : T.dbs.find((d) => d.inst === a.inst); if (k) openDb(k.key); }));
}
function bindPage() {
  const m = document.getElementById('main');
  bindActions(m);
  m.querySelectorAll('#segBoard button').forEach((b) => (b.onclick = () => { S.board = b.dataset.b; S.dim = S.board === 'inst' ? 'dbtime' : 'level'; render(); }));
  m.querySelectorAll('#segDim button').forEach((b) => (b.onclick = () => { S.dim = b.dataset.k; S.sortDesc = true; render(); }));
  m.querySelectorAll('#segTrig button').forEach((b) => (b.onclick = () => { S.trig = b.dataset.t; render(); }));
  m.querySelectorAll('.lvchip').forEach((c) => (c.onclick = () => { const k = c.dataset.lvf; S.lv.has(k) ? S.lv.delete(k) : S.lv.add(k); render(); }));
  const q = document.getElementById('q'); if (q) { q.oninput = () => { S.q = q.value; const pos = q.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos); }; }
  const th = document.getElementById('thVal'); if (th) th.onclick = () => { S.sortDesc = !S.sortDesc; render(); };
  const b2 = document.getElementById('btnNew2'); if (b2) b2.onclick = openNew;
}
function render() {
  renderPickers(); renderSide();
  const page = { overview, rank, runs, alerts, inventory }[S.page] || overview;
  document.getElementById('main').innerHTML = page(); bindPage();
  location.hash = S.page;
}
document.getElementById('btnNew').onclick = openNew;
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLayer(); });
const h = (location.hash || '').slice(1); if (['overview', 'rank', 'runs', 'alerts', 'inventory'].includes(h)) S.page = h;
render();
</script>
</body>
</html>
