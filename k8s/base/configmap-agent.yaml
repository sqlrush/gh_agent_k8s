# 全体 Pod 共用的非密配置(spec §6 环境变量契约)。样例值;平台按实际填写。
# Mac 验证时 scripts/k8s/verify-cluster.sh 会用 kubectl 覆盖成 host.docker.internal:8781。
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: gaussdb-agent
data:
  GRMP_API_HOST: grmp.example.internal
  GRMP_API_PORT: "8080"
  MODEL_BASE_URL: http://llm.example.internal/v1
  MODEL_ID: qwen3-32b
  MODEL_PROVIDER_NAME: model-service
