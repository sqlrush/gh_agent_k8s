apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - nas-pvc.yaml
  - configmap-agent.yaml
  - configmap-agent-roles.yaml
  - configmap-gateway.yaml
  - networkpolicy.yaml
  - gateway.yaml
  - frontend.yaml
# 五个 *.example.yaml 都是样例;平台用 kubectl create secret 创建真实的
# model-api / grmp-sm2 / gateway-auth,池化沙箱另要 sandbox-control / grmp-token。
# 原来的知识库向量库组件(openGauss StatefulSet 与它的 Secret)2026-10-23 下线:索引是 NAS 上知识库目录里的
# index/store.sqlite(SQLite + sqlite-vec),由 kb-import 写、runtime / 沙箱只读,不需要单独的组件。
# 池化沙箱的 Pod 由平台按 k8s/templates/sandbox.yaml 渲染,不在这里。
