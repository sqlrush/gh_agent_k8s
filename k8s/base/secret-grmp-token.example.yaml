# 样例,不要直接 apply。池化沙箱共用的 GRMP 令牌(需求 R2:令牌全体共用一个,工号仍随请求发给中间件)。
# 按需模式(网关)仍是每人一个 grmp-token-<工号>,两者互不影响。
#   kubectl -n gaussdb-agent create secret generic grmp-token --from-literal=GRMP_AUTH_TOKEN='<令牌>'
# 残余风险(方案 §13):共用令牌意味着所有人的数据库权限相同,按人授权只能在中间件侧做。
apiVersion: v1
kind: Secret
metadata:
  name: grmp-token
  namespace: gaussdb-agent
type: Opaque
stringData:
  GRMP_AUTH_TOKEN: "<中间件令牌,由平台填写>"
