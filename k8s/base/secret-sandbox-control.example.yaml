# 样例,不要直接 apply。池化沙箱的控制密钥(方案 §7):客户平台调副容器 4098 接口时放在请求头 X-Sandbox-Key。
# 只注入副容器(k8s/templates/sandbox.yaml),主容器里没有;平台与副容器之外谁都不该有它。至少 16 个字符。
#   kubectl -n gaussdb-agent create secret generic sandbox-control --from-literal=KEY="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: sandbox-control
  namespace: gaussdb-agent
type: Opaque
stringData:
  KEY: "<至少 16 个字符的随机串,由平台生成>"
