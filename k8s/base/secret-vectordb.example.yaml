# 样例。平台用 kubectl create secret 创建真实的,**不要**把口令提交进版本库。
#
# 三个口令,故意分开——runtime 对知识库是只读挂载,给它读写用户就等于开了个后门:
# 用户可以让模型在自己的 Pod 里读环境变量拿到口令,然后直接改派生索引。
#
#   GS_PASSWORD   openGauss 超级用户(gaussdb),只给 vectordb Pod 自己初始化用
#   KB_RW         kb_rw —— kb-import Pod 用,建表 / 写索引
#   KB_RO         kb_ro —— runtime Pod 用,只有 SELECT
#
# 建库建用户由 scripts/k8s/init-vectordb.sh 做(幂等),它从本 Secret 读这三个值。
#
#   kubectl -n gaussdb-agent create secret generic vectordb-auth \
#     --from-literal=GS_PASSWORD='<超级用户口令>' \
#     --from-literal=KB_RW='<读写口令>' \
#     --from-literal=KB_RO='<只读口令>'
#
# openGauss 对口令有强度要求(长度 ≥8,且含大写 / 小写 / 数字 / 特殊字符中的至少三类),
# 不满足时容器初始化会失败且日志里只说一句「Please check password」。
apiVersion: v1
kind: Secret
metadata:
  name: vectordb-auth
  namespace: gaussdb-agent
type: Opaque
stringData:
  GS_PASSWORD: "ChangeMe@2026"
  KB_RW: "ChangeMe@2026rw"
  KB_RO: "ChangeMe@2026ro"
