# Mac 本地覆盖:中间件 = 宿主上的 GRMP mock(经 scripts/tcp-forward.py 8781 → 8779);模型服务给个不可达的占位。
# 客户环境不要用这个文件。
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: gaussdb-agent
data:
  GRMP_API_HOST: host.docker.internal
  GRMP_API_PORT: "8781"
  MODEL_BASE_URL: http://host.docker.internal:9
  MODEL_ID: none
  MODEL_PROVIDER_NAME: model-service
