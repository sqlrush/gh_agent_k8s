# 发版台读的逐版本变化(人写,与 docs/版本说明.md「升级前先看」同步)。打包时 release/pack.py 把它与本次的事实
# (标签、提交、各镜像平台清单 digest、白名单全量)合成离线包里的 release.yaml。
#
# 只写「从新清单推不出来」的东西。新配置项的默认值在 k8s/base 的 ConfigMap 里,发版台按「集群现值 + 新清单默认值」迁移;
# 新的网络策略、kbstd 安装 Job 也都在新清单里,渲染时自然带上。这里写的是:
#   mixed_with   新版本能与哪些旧版本同时在线(网关新、池子槽位旧的那段时间)→ 池子按槽位在线替换;不在里面的按 Pod 整体替换
#   required     必须由行方填写、没有可用默认值的新配置项(没填发版台在开跑前拦下)
#   steps        新清单表达不了的特有动作:rebuild_kb_import(删 role=kb-import 的 Deployment,NAS 不动)
#   whitelist    本版本给白名单团队的增量文件(核对按全量,这里只用来告诉运维该交哪个文件)
#   notes        给运维看的提醒(不自动做的事)
#
# 版本从新到旧;第一条必须是本仓库清单里的版本(守卫测试)。min_upgrade_from 之前的版本按《部署上线方案》§14 手工升级。
min_upgrade_from: agent-v1.4.0
versions:
  - version: agent-v1.4.12
    mixed_with: [agent-v1.4.11, agent-v1.4.10]  # 网关没改;会话文件格式不变,槽位换到哪版用哪版
    required: []
    steps: [rebuild_kb_import]    # 导入镜像里的公共代码换了
    whitelist: []                 # 脚本与 v1.4.11 相同;从 v1.4.10 升级时 20261111 由 v1.4.11 那条带上
    notes:
      - "(按需)换过根规范的,用本版本的离线包重做 rootspec-overlay.sh 再推内网仓库(版本说明 v1.4.5「根规范模板替换」)"
      - "行方白名单没导入 scripts-delta-20261111.sql 时本版也不报错(取数在 postgres);要切到业务库仍须导入并确认登录「已直连」"
  - version: agent-v1.4.11
    mixed_with: [agent-v1.4.10]  # 网关没改;切库与登录改动跟着用户镜像走,槽位换到哪版用哪版(白名单没导本版增量时不切库)
    required: []
    steps: [rebuild_kb_import]    # 导入镜像里的公共代码换了
    whitelist: [scripts-delta-20261111.sql]
    notes:
      - "(按需)换过根规范的,用本版本的离线包重做 rootspec-overlay.sh 再推内网仓库(版本说明 v1.4.5「根规范模板替换」)"
      - "切到业务库要行方中间件支持 dbName、并导入 scripts-delta-20261111.sql;导入后用 --database <业务库> 登录看到「已直连」即生效"
  - version: agent-v1.4.10
